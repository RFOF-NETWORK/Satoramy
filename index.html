cat > index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATORAMY CLI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background:#000; color:#0f0; font-family:'SF Mono',Consolas,monospace;
         font-size:14px; overflow:hidden; display:flex; flex-direction:column; }
  #header { background:#001100; border-bottom:1px solid #0f0; padding:8px 16px;
            display:flex; justify-content:space-between; font-size:12px; flex-shrink:0; }
  #title { color:#0f0; font-weight:bold; }
  #status { color:#666; } #status.online { color:#0f0; } #status.offline { color:#f44; }
  #output { flex:1; overflow-y:auto; padding:12px 16px; white-space:pre-wrap;
            word-break:break-all; line-height:1.5; font-size:13px; }
  .cmd { color:#0f0; } .ok { color:#0f0; } .err { color:#f44; }
  .warn { color:#fa0; } .dim { color:#666; } .info { color:#0af; }
  .accent { color:#0f0; font-weight:bold; }
  #inputline { border-top:1px solid #0f0; background:#001100; padding:8px 16px;
               display:flex; align-items:center; flex-shrink:0; }
  #prompt-sym { color:#0f0; margin-right:8px; font-weight:bold; }
  #cmd { flex:1; background:transparent; border:none; color:#0f0; font-family:inherit;
         font-size:14px; outline:none; caret-color:#0f0; }
</style>
</head>
<body>
<div id="header">
  <div id="title">SATORAMY · X·X·∞ = 1·∞</div>
  <div id="status">○ prüfe…</div>
</div>
<div id="output"></div>
<div id="inputline">
  <span id="prompt-sym">&gt;</span>
  <input id="cmd" autofocus autocomplete="off" spellcheck="false" />
</div>
<script>
const out = document.getElementById("output");
const cmdInput = document.getElementById("cmd");
const statusEl = document.getElementById("status");
let history = [], histIdx = -1;

function line(t, c = "") {
  const d = document.createElement("div");
  d.className = "line " + c; d.textContent = t;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
}
async function api(p, o) {
  const r = await fetch(p, o);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function checkServer() {
  try {
    const j = await api("/api/status");
    statusEl.textContent = "● online · " + j.blocks + " Blöcke";
    statusEl.className = "online"; return true;
  } catch {
    statusEl.textContent = "● offline";
    statusEl.className = "offline"; return false;
  }
}
async function boot() {
  line("╔══════════════════════════════════════════════╗", "accent");
  line("║      SATORAMY · X·X·∞ = 1·∞ · CLI                    ║", "accent");
  line("╚══════════════════════════════════════════════╝", "accent");
  line("");
  if (await checkServer()) line("✓ Server verbunden", "ok");
  else { line("✗ Server nicht erreichbar", "err");
         line("  Starte: python3 satoramy.py", "warn"); }
  line("");
  line("Tippe 'help' für alle Befehle.", "dim");
  line("");
}
async function run(raw) {
  const input = raw.trim(); if (!input) return;
  line("> " + input, "cmd");
  const [cmd, ...args] = input.split(/\s+/);
  const c = cmd.toLowerCase();
  try {
    switch (c) {
      case "help":
        line("Befehle:", "accent");
        line("  help          — diese Liste");
        line("  status        — Server-Status");
        line("  chain         — gesamte Kette");
        line("  ls            — Kette kompakt");
        line("  get <n>       — Block n");
        line("  add <data>    — neuen Block");
        line("  verify        — Kette prüfen");
        line("  reset         — DB zurücksetzen");
        line("  export        — JSON herunterladen");
        line("  ping          — Verbindung prüfen");
        line("  clear         — Ausgabe löschen");
        break;
      case "clear": out.innerHTML = ""; break;
      case "ping": line(await checkServer() ? "✓ pong" : "✗ offline"); break;
      case "status": line(JSON.stringify(await api("/api/status"), null, 2), "info"); break;
      case "chain": {
        const ch = await api("/api/chain");
        line("Kette: " + ch.length + " Blöcke", "accent");
        for (const b of ch)
          line("  #" + String(b.idx).padStart(3) + " x=" + (b.x > 0 ? "+" : "-") + "1  " + b.data + "  [" + b.hash + "]");
        break;
      }
      case "ls": {
        for (const b of await api("/api/chain"))
          line("#" + String(b.idx).padStart(3) + " " + (b.x > 0 ? "+" : "-") + " " + b.hash + "  " + b.data.substring(0, 40));
        break;
      }
      case "get": {
        const n = parseInt(args[0]);
        if (isNaN(n)) { line("✗ get <n>", "err"); break; }
        const b = (await api("/api/chain")).find(x => x.idx === n);
        if (!b) { line("✗ nicht gefunden", "err"); break; }
        line(JSON.stringify(b, null, 2), "info");
        break;
      }
      case "add": {
        const data = args.length ? args.join(" ") : "auto-" + Date.now();
        const r = await api("/api/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data })
        });
        line("✓ Block #" + r.idx + "  x=" + (r.x > 0 ? "+" : "-") + "1  hash=" + r.hash, "ok");
        await checkServer();
        break;
      }
      case "verify": {
        const v = await api("/api/verify");
        if (v.valid) line("✓ gültig · " + v.blocks + " Blöcke · product=" + v.product + " · closed=" + v.closed, "ok");
        else line("✗ fehlerhaft bei #" + v.bad, "err");
        break;
      }
      case "reset":
        if (!confirm("Alle Blöcke löschen?")) { line("abgebrochen", "dim"); break; }
        await api("/api/reset"); line("✓ zurückgesetzt", "ok"); await checkServer(); break;
      case "export": {
        const ch = await api("/api/chain");
        const blob = new Blob([JSON.stringify(ch, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "satoramy_chain.json";
        a.click();
        line("✓ " + ch.length + " Blöcke exportiert", "ok");
        break;
      }
      default:
        line("✗ Unbekannt: " + c, "err");
        line("  Tippe 'help'", "dim");
    }
  } catch (e) {
    line("✗ Fehler: " + e.message, "err");
    line("  Server läuft? -> python3 satoramy.py", "warn");
    await checkServer();
  }
}
cmdInput.addEventListener("keydown", async e => {
  if (e.key === "Enter") {
    const v = cmdInput.value; cmdInput.value = "";
    if (v.trim()) { history.push(v); histIdx = history.length; }
    await run(v);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; cmdInput.value = history[histIdx]; }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; cmdInput.value = history[histIdx]; }
    else { histIdx = history.length; cmdInput.value = ""; }
  }
});
document.addEventListener("click", () => cmdInput.focus());
boot();
setInterval(checkServer, 5000);
</script>
</body>
</html>
HTMLEOF
